# 운영 배포용 compose (#86) — Oracle Cloud Always Free VM 1대에서 실행. 절차·근거: docs/operations.md 8장
# 실행(VM의 저장소 루트에서): docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
#   모니터링까지: 위 명령에 --profile monitoring (Grafana는 외부에 열지 않음 → SSH 터널로 접속)
#
# 루트 docker-compose.yml(로컬 개발)과 다른 점
#   - 앱은 prod 프로필: 필수 환경변수 누락·가짜 PG·Swagger를 ProdProfileGuard가 기동 전에 막음
#   - 인터넷에 여는 포트는 Caddy의 80·443뿐. db·redis·kafka·app은 compose 네트워크 안에서만 접근
#     (로컬용 127.0.0.1 포트 매핑도 두지 않음 — DB 확인은 `docker compose exec db psql`)
#   - Kafka는 내부 리스너(kafka:9092)만 — 로컬 실행용 EXTERNAL 리스너 없음
#   - restart: unless-stopped — VM 재부팅·프로세스 종료 후 자동 재시작
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 deploy/.env.prod에 지정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 deploy/.env.prod에 지정하세요}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 결제 멱등성 키·스케줄러 분산 락 — AOF 영속화 이유는 루트 docker-compose.yml과 같음
  redis:
    image: redis:8.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft 단일 노드 — 설정 근거는 루트 docker-compose.yml. 힙을 512MB로 제한해 VM 메모리를 앱·DB에 남김
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/delivery
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 deploy/.env.prod에 지정하세요}
      # 프론트(Vercel) 주소 — SSE를 API 주소로 직접 연결할 때 필요 (그 밖의 API는 Vercel rewrite라 같은 출처)
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN(https://xxx.vercel.app)을 deploy/.env.prod에 지정하세요}
      # 힙을 컨테이너 메모리 기준이 아닌 고정값으로 — VM 전체 메모리의 1/4을 잡지 않도록
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g
      NOTIFICATION_SENDER: ${NOTIFICATION_SENDER:-log}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # 토스: test_ 키만 허용(ProdProfileGuard). 비우면 모의 결제(POST /api/payments)만. 가짜 PG(fake)는 prod에서 기동 불가
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 소셜 로그인은 Vercel rewrite를 거치므로 콜백·결과 화면 모두 프론트 주소 기준
      SOCIAL_FRONTEND_CALLBACK_URL: ${FRONTEND_ORIGIN}/oauth/callback
      SOCIAL_REDIRECT_BASE_URL: ${FRONTEND_ORIGIN}
    # 호스트 포트 없음 — Caddy만 app:8080으로 접근. 관리 포트 8081은 Prometheus만

  # HTTPS 종료 + 역방향 프록시. Let's Encrypt 인증서를 자동 발급·갱신 (80은 인증서 발급·HTTPS 이동용)
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN(예 1-2-3-4.sslip.io)을 deploy/.env.prod에 지정하세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 인증서 — 지우면 재발급(발급 횟수 제한)되므로 볼륨으로 유지
      - caddy-config:/config

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  # 외부에 열지 않음 → `ssh -L 3000:localhost:3000 ubuntu@VM` 후 http://localhost:3000
  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "admin" ]; then
          echo "GRAFANA_ADMIN_PASSWORD를 deploy/.env.prod에 지정하세요 (빈 값·admin 불가)" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  redis-data:
  kafka-data:
  caddy-data:
  caddy-config:
